# suppress inspection "UnusedProperty" for whole file
spring.application.name=spring-6-webclient
webclient.rooturl=http://localhost:8080

# Provider Configuration
spring.security.oauth2.client.provider.springauth.token-uri=http://localhost:9000/oauth2/token

# Client Registration
spring.security.oauth2.client.registration.my-client.client-name=My client name
spring.security.oauth2.client.registration.my-client.client-id=messaging-client
spring.security.oauth2.client.registration.my-client.client-secret=secret
spring.security.oauth2.client.registration.my-client.scope[0]=message.read
spring.security.oauth2.client.registration.my-client.scope[1]=message.write
spring.security.oauth2.client.registration.my-client.authorization-grant-type=client_credentials
spring.security.oauth2.client.registration.my-client.provider=springauth